<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <h2>Afghan</h2>
                <p>Admin Panel</p>
            </div>
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Users</a>
                <a href="#">Products</a>
                <a href="#">Orders</a>
                <a href="#">Categories</a>
                <a href="#">Message</a>
                <a href="#">Analytics</a>
                <a href="#">Settings</a>
                 </nav>

                <div class="profile">
                    <div class="image"></div>
                    <div class="info">
                        <h4>Admin User</h4>
                        <p>admin@gmail.com</p>
                    </div>
                </div>
           
        </aside>
        <main class="main">
            <header class="navbar">
                <div class="left">
                    <h2>Dashboard</h2>
                    <p>Welcome back,Admin</p>
                </div>
                <div class="right">
                    <input type="text" placeholder="Search.....">
                    <div class="notification">🔔</div>
                    <div class="user">
                        <div class="avatar"></div>
                        <span>Admin</span>
                    </div>
                </div>
            </header>
            <section class="banner">
                <div class="banner-top">
                    <div class="banner-text">
                    <h2>Welcome Back,Admin</h2>
                    <p>Here's what's hepppening with your store today</p>
                    </div>
                    <div class="banner-buttons">
                        <button>Export</button>
                        <button>Refresh</button>
                    </div>
                </div>

                <div class="banner-cards">
                    <div class="mini-card">
                        <h3>120</h3>
                        <p>Today's order</p>
                    </div>

                    <div class="mini-card">
                        <h3>45</h3>
                        <p>New Users</p>
                    </div>
                    <div class="mini-card">
                        <h3>$8.5k</h3>
                        <p>Revenue</p>
                    </div>
                    <div class="mini-card">
                        <h3>95%</h3>
                        <p>Conversion</p>
                    </div>
                </div>

            </section>
            <section class="cards">
                
            </section>
            <section class="analytics"></section>
            <section class="bottom"></section>
            <section class="pending"></section> 
        </main>
    </div>
