<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <link rel="stylesheet" href="box.css">
</head>
<body>

    

    <div class="container">
      <div class="heading"><h1>Box Model</h1></div>
      
      <div class="box">
        Every element on the page has its own box,which can be styled using css.
      </div>
      <div class="box">From the inside out:</div>

      <ul class="list">
        <li>Content</li>
        <li>Padding</li>
        <li>Border</li>
        <li>Margin</li>    
      </ul>
      <h2>Background</h2>
      <div class="box">Keep in mind that a background will cover the content and the padding.</div>
    </div>

</body>
</html>
