<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ececec;
}

.card{
    width:350px;
    background:white;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
    text-align:center;
}

.top{
    height:150px;
    background:#3f6df5;
}

.profile{
    margin-top:-75px;
}

.profile img{
    width:150px;
    height:150px;
    border-radius:50%;
    border:5px solid white;
    object-fit:cover;
}

.content{
    padding:15px 25px 30px;
}

.content h2{
    margin-top:10px;
    font-size:34px;
}

.content p{
    font-size:20px;
    color:#555;
    margin-top:8px;
}

.social{
    display:flex;
    justify-content:center;
    gap:18px;
    margin:25px 0;
}

.social a{
    width:50px;
    height:50px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    text-decoration:none;
    font-size:22px;
}

.facebook{
    background:#1877F2;
}

.twitter{
    background:#1DA1F2;
}

.instagram{
    background:#E1306C;
}

.youtube{
    background:#FF0000;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:30px;
}

button{
    border:none;
    background:#3f6df5;
    color:white;
    padding:12px 35px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#274bc5;
}

.stats{
    display:flex;
    justify-content:space-evenly;
    border-top:1px solid #ddd;
    padding-top:20px;
}

.stats div{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:22px;
    color:#444;
}

.stats i{
    font-size:24px;
}

</style>

</head>
<body>

<div class="card">

    <div class="top"></div>

    <div class="profile">
        <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="profile">
    </div>

    <div class="content">

        <h2>CodingLab</h2>

        <p>YouTuber & Blogger</p>

        <div class="social">

            <a href="#" class="facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>

            <a href="#" class="twitter">
                <i class="fa-brands fa-twitter"></i>
            </a>

            <a href="#" class="instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>

            <a href="#" class="youtube">
                <i class="fa-brands fa-youtube"></i>
            </a>

        </div>

        <div class="buttons">

            <button>Subscribe</button>

            <button>Message</button>

        </div>

        <div class="stats">

            <div>
                <i class="fa-regular fa-heart"></i>
                <span>60.4k</span>
            </div>

            <div>
                <i class="fa-regular fa-comment"></i>
                <span>20k</span>
            </div>

            <div>
                <i class="fa-solid fa-share"></i>
                <span>12.4k</span>
            </div>

        </div>

    </div>

</div>

</body>
</html>
