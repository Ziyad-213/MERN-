<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input {
    border: none;
    border-bottom: 2px solid black;
    outline: none;
}
    </style>
</head>
<body>

    <h1 style="text-align: center;"><mark>Sports Physical Form</mark></h1>


    <form action="action.html" method="get">
        
        <fieldset>
           <legend><h2>Athelete Information</h2></legend>
           <ul>
            <li><label for="name">Enter Your name: </label>
            <input type="text" name="username" id="name">
           
        </li>
            <li><label for="age" >School Team: </label>
        <input type="text" name="age" id="age"></li>
        </li>
            <li><label for="sport">Sport: </label>
        <input type="text" name="sport" id="sport"></li>
        </li>
            <li><label for="parent">Parent Guardian Name:</label>
        <input type="text" name="parent" id="parent"></li>
            </li>
            <li><label for="contact">Contact Number: </label>
        <input type="text" name="contact" id="contact"></li>
            
           </ul>
        </fieldset>
        <fieldset>
           <legend><h2>Medical History</h2></legend>

          <ul>
            <li>
                History of Concussion:
               
                
                <input type="radio" name="history_concussion" id="history_concussion_yes" value="history_concussion_yes">
                <label for="history_concussion_yes">Yes</label>

                <input type="radio" name="history_concussion" id="history_concussion_no" value="history_concussion_no">

                <label for="history_concussion_no">No</label>
                
                
                
            </li>


            <li><label for="previous_surgeries">Previous surgeries</label>
            <input type="text" name="previous_surgeries" id="previous_surgeries"></li>
            <li>Any Bone Fracture?
                <input type="radio" name="bone" id="bone_yes" value="bone_yes">
                <label for="bone_yes">Yes</label>
                    <input type="radio" name="bone" id="bone_no" value="bone_no">
                <label for="bone_no">No</label>
            </li>

             <li>Asthma or Breathing Problem?
                <input type="radio" name="asthma" id="asthma_yes" value="asthma_yes">
                <label for="asthma_yes">Yes</label>
                    <input type="radio" name="asthma" id="asthma_no" value="asthma_no">
                <label for="asthma_no">No</label>
            </li>
            

          </ul>
        </fieldset>
        <br>

        <fieldset>
      
            <legend><strong>Select your Department</strong></legend>
            <select name="department" id="department">
                <option value="">-- Select Department --</option>
            <option value="CSE">CSE</option>
            <option value="CYBER">CYBER</option>
            <option value="BIOTECH">BIOTECH</option>
            <option value="AIML">AIML</option>
        </select>
        </fieldset>
        <br>

        <fieldset>
            <legend><strong>Select your hobbies</strong></legend>
            <label for="cricket">Cricket</label>
            <input type="checkbox" name="cricket" id="cricket">

            <label for="soccer">Soccer</label>
            <input type="checkbox" name="soccer" id="soccer">

            <label for="volleyball">VolleyBall
            <input type="checkbox" name="volleyball" id="volleyball">
        
        
        
        
        </fieldset>
        <br>
        

        <fieldset>
            <legend>Text area</legend>
          <textarea name="summary" id="summary" placeholder="Enter here"></textarea>
        </fieldset>
      <br>
        <fieldset>
            <legend>Select your Document</legend>
            <ul>
                <li>
            <label for="image">Your Picture</label>
            <input type="file" name="image" id="image" value="image" accept=".jpg" >
                        </li>
<br>
                           <li>
            <label for="doc">Resume</label>
            <input type="file" name="document" id="doc" value="doc" accept=".pdf" >
                        </li>

            </ul>
            

        </fieldset>
        
        <br>

        <fieldset>
            <legend>Enter Your Email</legend>
            <input type="email" placeholder="@gmail.com" >
        </fieldset>
        <br>

        <fieldset>
            <legend>Enter Your Password</legend>
            <input type="password">
           
            
        </fieldset>
        <br>

        <fieldset>
            <legend>Date</legend>
            <input type="time"  >
        </fieldset>
        <br>



        <fieldset>
            <legend><h2>Fitness Asessment</h2></legend>



        
        </fieldset>
        <br>

       
       
        <input type="submit" value="submit">

      

    


    </form>
    
</body>
</html>
