<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  
</head>


<body>

    <h1 style="text-align: center;">Student Registration Form</h1>
    <form action="#" method="get">
     
    <label for="first_name">First Name</label>
    <input type="text" id="first_name" name="first_name" maxlength="30"> max 30 character 
  
    <br>
    <br>
    <label for="last_name">Last Name</label>
    <input type="text" id="last_name" name="last_name" maxlength="30"> max 30 character 
    <br><br>


    <Label for="dob">DOB</Label>
    <input type="date" name="dob" id="dob">


     <br><br>


    <Label for="email">Email</Label>
    <input type="email" name="email" id="email">
     <br><br>


    <Label for="phone">Phone Number </Label>
    <input type="tel" name="phone" id="phone"> upto 10 digit
    <br><br>
    Gender 
    <label for="male">male</label>
    <input type="radio" name="gender" id="male" value="male">
    <label for="female">Female</label>
    <input type="radio" name="gender" id="female" value="female">

    <br><br>
    <label for="adress">Address</label>
    <textarea name="adress" id="adress"></textarea>
    <br><br>

      <label for="city">City</label>
    <input type="text" id="city" name="city" > 
    <br><br>

      <label for="pincode">PIN code </label>
    <input type="text" id="pincode" name="pincode" maxlength="6" pattern="[0-9]{6}" >digit number
    <br><br>

    <label for="state">State</label>
    <select name="state" id="state">
      <option value="">--Select Your State--</option>
    <option value="Andhra Pradesh">Andhra Pradesh</option>
    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
    <option value="Assam">Assam</option>
    <option value="Bihar">Bihar</option>
    <option value="Chhattisgarh">Chhattisgarh</option>
    <option value="Goa">Goa</option>
    <option value="Gujarat">Gujarat</option>
    <option value="Haryana">Haryana</option>
    <option value="Himachal Pradesh">Himachal Pradesh</option>
    <option value="Jharkhand">Jharkhand</option>
    <option value="Karnataka">Karnataka</option>
    <option value="Kerala">Kerala</option>
    <option value="Madhya Pradesh">Madhya Pradesh</option>
    <option value="Maharashtra">Maharashtra</option>
    <option value="Manipur">Manipur</option>
    <option value="Meghalaya">Meghalaya</option>
    <option value="Mizoram">Mizoram</option>
    <option value="Nagaland">Nagaland</option>
    <option value="Odisha">Odisha</option>
    <option value="Punjab">Punjab</option>
    <option value="Rajasthan">Rajasthan</option>
    <option value="Sikkim">Sikkim</option>
    <option value="Tamil Nadu">Tamil Nadu</option>
    <option value="Telangana">Telangana</option>
    <option value="Tripura">Tripura</option>
    <option value="Uttar Pradesh">Uttar Pradesh</option>
    <option value="Uttarakhand">Uttarakhand</option>
    <option value="West Bengal">West Bengal</option>

    </select>
    <br><br>


    <label for="country">Country</label>
    <input type="text" id="country" name="country" value="India" readonly >
    <br><br>

    Hobbies 
    <label for="drawing">Drawing</label>
    <input type="checkbox" name="hobby" id="drawing" value="drawing">

    <label for="dancing">Dancing</label>
    <input type="checkbox" name="hobby" id="dancing" value="dancing">

    <label for="swimming">Swimming</label>
    <input type="checkbox" name="hobby" id="swimming" value="swimming">

    <label for="singing">Singing</label>
    <input type="checkbox" name="hobby" id="singing" value="singing">
    <br>
    <label for="other">other</label>
    <input type="checkbox" name="hobby" id="other" value="other">
   <textarea id="other_hobby" name="other_hobby"></textarea>

   <br><br>

   
   
  </form>
  <h3>Qualification</h3>

  <table border="1" cellspacing="0" cellpadding="15">

    <tr>
      <th>Sr.no</th>
      <th>Examination</th>
      <th>Board</th>
      <th>Percentage</th>
      <th>year of passing</th>
    </tr>

    <tr>
      <td>1</td>
      <td>Class X</td>
      <td><input type="text" name="classX"></td>
      <td><input type="number" name></td>
    </tr>
    <tr>
      <td>2</td>
      <td>Class XI</td>
      <td><input type="text" name="classXI"></td>
    </tr>
    <tr>
      <td>3</td>
      <td>Class XII</td>
      <td><input type="text" name="classXII"></td>
    </tr>

  </table>
 

  
  
  
  
  <input type="submit" value="submit">
  <input type="reset" value="reset">

    
    
    
</body>
</html>
