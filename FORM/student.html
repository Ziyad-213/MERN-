<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1 style="text-align: center;">Student Registration Form</h1>
    <label for="first_name">First Name</label>
    <input type="text" id="first_name" name="first_name" > max 30 character 
    <br>
    <br>
    <label for="last_name">Last Name</label>
    <input type="text" id="last_name" name="last_name" > max 30 character 
    <br><br>


    <Label for="dob">DOB</Label>
    <input type="date" name="dob" id="dob">


     <br><br>


    <Label for="email">Email</Label>
    <input type="email" name="email" id="email">
     <br><br>


    <Label for="phone">Phone Number </Label>
    <input type="number" name="phone" id="phone"> upto 10 digit
    <br><br>
    Gender 
    <label for="male">male</label>
    <input type="radio" name="gender" id="male">
    <label for="female">Female</label>
    <input type="radio" name="gender" id="female" >

    <br><br>
    <label for="adress">Adress</label>
    <textarea name="adress" id="adress"></textarea>
    <br><br>

      <label for="city">City</label>
    <input type="text" id="city" name="city" > 
    <br><br>

      <label for="pincode">PIN code </label>
    <input type="number" id="pincode" name="pincode" >digit number
    <br><br>

    <select name="state" id="state">
      <option value="">--Select Your State--</option>
    <option value="Andhra Pradesh">Andhra Pradesh</option>
    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
    <option value="Assam">Assam</option>
    <option value="Bihar">Bihar</option>
    <option value="Chhattisgarh">Chhattisgarh</option>
    <option value="Goa">Goa</option>
    <option value="Gujarat">Gujarat</option>
    <option value="Haryana">Haryana</option>
    <option value="Himachal Pradesh">Himachal Pradesh</option>
    <option value="Jharkhand">Jharkhand</option>
    <option value="Karnataka">Karnataka</option>
    <option value="Kerala">Kerala</option>
    <option value="Madhya Pradesh">Madhya Pradesh</option>
    <option value="Maharashtra">Maharashtra</option>
    <option value="Manipur">Manipur</option>
    <option value="Meghalaya">Meghalaya</option>
    <option value="Mizoram">Mizoram</option>
    <option value="Nagaland">Nagaland</option>
    <option value="Odisha">Odisha</option>
    <option value="Punjab">Punjab</option>
    <option value="Rajasthan">Rajasthan</option>
    <option value="Sikkim">Sikkim</option>
    <option value="Tamil Nadu">Tamil Nadu</option>
    <option value="Telangana">Telangana</option>
    <option value="Tripura">Tripura</option>
    <option value="Uttar Pradesh">Uttar Pradesh</option>
    <option value="Uttarakhand">Uttarakhand</option>
    <option value="West Bengal">West Bengal</option>

    </select>
    <br><br>


    <label for="country">Country</label>
    <input type="text" id="country" name="country" value="India" readonly >
    <br><br>

    Hobbies 
    <label for="drawing">Drawing</label>
    <input type="radio" name="hobby" id="drawing">

    <label for="dancing">Dancing</label>
    <input type="radio" name="hobby" id="dancing">

    <label for="swimming">Swimming</label>
    <input type="radio" name="hobby" id="swimming">

    <label for="singing">Singing</label>
    <input type="radio" name="hobby" id="singing">

    

    
    
    
</body>
</html>
