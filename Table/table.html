<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table,
        td,
        th,
        tr{
            border: 1px solid;
            border-collapse: collapse;
            padding: 5px;
        }
        thead{
            background-color: red;
        }
     
    </style>


  
</head>
<body>

        <thead>
            <tr>

                <th>Emp Name</th>
                <th>Job Title</th>

        </thead>
        <tbody>
            <tr>
                <td>911</td>

                <td>Umemployed</td>
                <td>0</td>
            </tr>

             <tr>
                <td>211</td>
                <td>Asna</td>
                <td>Teacher</td>
                <td>2020</td>
            </tr>
                 <tr>
                <td>9911</td>
                <td>Joseph</td>
                <td>Teacher</td>
                <td>20320</td>
            </tr>
        </tbody>
        <tfoot></tfoot>
    </table>
</body>
</html>
